name: Maintix CD

on:
  workflow_run:
    workflows: ["Maintix CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy AWS EC2
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
